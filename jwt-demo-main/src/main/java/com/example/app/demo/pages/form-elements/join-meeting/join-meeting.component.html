<div class="meetings-container">
  <div *ngIf="loading" class="loading">Chargement de vos réunions...</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <!-- If embedding, show the jitsi container full screen -->
  <div *ngIf="isEmbedding">
    <div #jitsiContainer style="height: calc(100vh - 40px); width: 100%;"></div>
  </div>

  <!-- Otherwise show list of meetings created by tutor -->
  <div *ngIf="!isEmbedding">
    <h3>Mes réunions</h3>
    <div *ngIf="meetings.length === 0" class="text-muted">Aucune réunion trouvée.</div>

    <div class="meeting-list">
      <div class="meeting-card" *ngFor="let m of meetings">
        <div class="meeting-main">
          <div>
            <h4>{{ m.title || ('Meeting ' + m.id) }}</h4>
            <div class="muted">{{ m.date | date:'dd/MM/yyyy HH:mm' }}</div>
          </div>
          <div class="meeting-actions">
            <button class="btn btn-sm btn-primary me-1" (click)="joinInApp(m)">Ouvrir</button>
            <button class="btn btn-sm btn-outline-secondary me-1" (click)="copyLink(m)">Copier</button>
            <button class="btn btn-sm btn-outline-info me-1" *ngIf="m.meetingLink" (click)="openExternal(m)">Ouvrir lien</button>
          </div>
        </div>
        <div class="meeting-footer text-muted">Salle: {{ m.roomID || m.roomId || m.id }}</div>
      </div>
    </div>
  </div>
</div>
