<div class="board-topbar d-flex align-items-center justify-content-between mb-3">
  <h2 class="mb-0">Mon tableau de tâches</h2>
  <div class="board-stats text-muted">Total: <strong>{{ totalTasks }}</strong></div>
</div>

<div class="board-container" cdkDropListGroup>
  <div class="column" *ngFor="let status of statuts">
    <div class="column-header">
      <div>
        <h3 class="mb-0">{{ status.label }}</h3>
        <small class="text-muted">{{ status.tasks.length }} tâche{{ status.tasks.length > 1 ? 's' : '' }}</small>
      </div>
      <div class="column-accent" [attr.data-status]="status.value"></div>
    </div>

    <div
      cdkDropList
      [cdkDropListData]="status.tasks"
      class="task-list"
      [cdkDropListConnectedTo]="connectedDropLists"
      (cdkDropListDropped)="onDrop($event, status.value)"
    >
      <div *ngIf="status.tasks.length === 0" class="empty-placeholder">Aucune tâche</div>

      <div
        class="task-card"
        *ngFor="let task of status.tasks"
        [attr.data-status]="task.statut"
        cdkDrag
      >
        <div class="task-top d-flex align-items-start justify-content-between">
          <div class="task-info">
            <h4 class="task-title">{{ task.titre }}</h4>
            <div class="task-meta text-muted">
              <small>{{ task.dateDebut }} · {{ task.dateFin }}</small>
            </div>
          </div>
          <div class="task-handle" cdkDragHandle aria-hidden="true"><i class="fas fa-grip-vertical"></i></div>
        </div>

        <p class="task-desc">{{ task.description }}</p>

        <div class="task-footer d-flex align-items-center justify-content-between">
          <div class="task-tags">
            <span *ngIf="task.priorite" class="badge bg-secondary me-1">{{ task.priorite }}</span>
            <span *ngIf="task.type" class="badge bg-light text-dark">{{ task.type }}</span>
          </div>
          <div class="task-actions text-muted"><small>Drag to move</small></div>
        </div>
      </div>
    </div>
  </div>
</div>
