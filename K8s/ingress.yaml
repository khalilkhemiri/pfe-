apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pfe-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: pfe.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pfe-frontend-service
                port:
                  number: 80
          
